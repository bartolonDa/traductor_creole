name: traductor_creole
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.8.3
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.5
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/google_logo.png
    - assets/images/logo_app2.png
    - assets/images/logo_app.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_app2.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_app2.png"